name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 只有 devDependencies；运行期依赖 node:sqlite / node:zlib，无原生模块
      # 用 ci 而不是 install：lockfile 与 package.json 一旦不同步就直接失败。
      # v0.3.0 正是因为漏了这一步（改了版本没改兄弟依赖），发布出去不可安装。
      - name: 安装依赖（严格按 lockfile）
        run: npm ci

      - name: 版本与依赖一致性门禁
        run: node scripts/ci-check-publish.mjs

      - name: 编译 10 个包
        run: npm run build

      - name: 类型检查（含测试用到的 .d.ts 形状）
        run: npm run typecheck

      - name: 单元与集成测试
        run: npm test

      - name: SDR 性质校验（错了就全盘失效的那一层）
        run: npm run check

      # v0.5.1：README 里的数字（规模 / 测试数 / Node 版本 / 缺点条数 / 依赖口径）
      # 必须与代码一致。评审发现同一个事实最多有四个值，根因是"手写死的"。
      - name: README 数字校验
        run: npm run check:readme

      - name: mnemo-bench
        run: npm run bench:eval

      - name: 基准门槛
        run: node scripts/ci-assert-bench.mjs

      # v0.5.2：规模门槛（D15/D25）。
      # 1 万 cell 合成语料 · recall p95 ≤ 40 ms · 索引构建 ≤ 3 s · 索引内存 ≤ 4 MB。
      # 这个数 README 从 v0.3 就写着，而 CI 里从来没有断言过它。
      - name: 规模门槛（1 万 cell）
        run: npm run ci:assert-scale

      - name: 上传基准报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-node${{ matrix.node }}
          path: artifacts/bench.json
          if-no-files-found: warn
          retention-days: 14

  # v0.5：npm 版本矩阵。
  #
  # v0.4 的 lockfile 只锁了 esbuild 的 win32 平台包，npm 10 放行、npm 11 直接失败。
  # 这条 job 让"下一代 npm"的问题在发版前就红，而不是等用户装不上。
  npm-latest:
    name: npm@latest · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 升级到最新 npm
        run: npm install -g npm@latest && npm --version

      - name: npm ci（严格按 lockfile）
        run: npm ci

      - name: 版本与依赖一致性门禁（含平台中立性）
        run: node scripts/ci-check-publish.mjs

      # v0.5.2 修的一处 CI 红灯：这个 job 原来**没有 build**，
      # 而 `check:readme` 默认会跑一遍测试拿真实条数——lib/ 不在，测试全失败，
      # 于是报"拿不到 # tests N"，job 红。两个修法一起上：
      #   ① 这里补 build（本来也该验证"能不能编译"）；
      #   ② check-readme 在 lib 缺席时退回静态计数（见脚本注释）。
      - name: 编译 10 个包
        run: npm run build

      - name: README 数字校验
        run: npm run check:readme

      - name: 类型检查
        run: npm run typecheck

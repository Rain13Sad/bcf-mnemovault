<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="MnemoVault data flow: write lane, read lane and sleep cycle">
  <title>MnemoVault — one turn, end to end</title>
  <desc>Every message writes one fixed-size cell; every reply reads four channels and injects about 116 tokens; a sleep cycle abstracts, associates and demotes.</desc>

  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0b0820"/>
      <stop offset="0.45" stop-color="#0a1030"/>
      <stop offset="1" stop-color="#04141c"/>
    </linearGradient>
    <radialGradient id="fglowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b4bff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#5b4bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fglowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#25d3c2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#25d3c2" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6390"/>
    </marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fe0d0"/>
    </marker>
    <marker id="arV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b7cff"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0a45e"/>
    </marker>
    <style>
      .h1   { font: 600 23px/1 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #ffffff; letter-spacing: -.2px; }
      .h2   { font: 400 13px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #6f7f9f; letter-spacing: 1.2px; }
      .lane { font: 600 12px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 2.2px; }
      .when { font: 400 11.5px/1 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5d6790; }
      .bt   { font: 500 14.5px/1 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #dfe4f5; }
      .bs   { font: 400 11px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #8a93b5; }
      .cap  { font: 400 12.5px/1 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5d6790; }
    </style>
  </defs>

  <rect width="1280" height="520" rx="16" fill="url(#fbg)"/>
  <ellipse cx="1050" cy="110" rx="380" ry="230" fill="url(#fglowA)"/>
  <ellipse cx="220" cy="490" rx="380" ry="170" fill="url(#fglowB)"/>
  <rect x="0.5" y="0.5" width="1279" height="519" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <text class="h1" x="44" y="54">One turn, end to end</text>
  <text class="h2" x="44" y="80">WRITE ONE CELL · READ FOUR CHANNELS · INJECT ~116 TOKENS</text>
  <line x1="44" y1="102" x2="1236" y2="102" stroke="#ffffff" stroke-opacity="0.06"/>
  <line x1="168" y1="126" x2="168" y2="392" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- ============ WRITE ============ -->
  <text class="lane" x="44" y="176" fill="#3fe0d0">WRITE</text>
  <text class="when" x="44" y="194">every turn</text>

  <rect x="188" y="142" width="180" height="66" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
  <text class="bt" x="204" y="169">utterance</text>
  <text class="bs" x="204" y="188">+ tool result</text>

  <rect x="404" y="142" width="206" height="66" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
  <text class="bt" x="420" y="169">encoder</text>
  <text class="bs" x="420" y="188">→ propositions</text>

  <rect x="646" y="142" width="330" height="66" rx="10" fill="#3fe0d0" fill-opacity="0.07" stroke="#3fe0d0" stroke-opacity="0.34"/>
  <text class="bt" x="662" y="165">MemCell · 341 B fixed base</text>
  <text class="bs" x="662" y="184">SDR 2048 · int8 vector · typed edges</text>
  <text class="bs" x="662" y="198" fill="#6f7f9f">bi-temporal · affect reading · version chain</text>

  <rect x="1012" y="142" width="224" height="66" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
  <text class="bt" x="1028" y="169">brotli residual</text>
  <text class="bs" x="1028" y="188">original bytes, recoverable</text>

  <line x1="372" y1="175" x2="398" y2="175" stroke="#5a6390" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="614" y1="175" x2="640" y2="175" stroke="#3fe0d0" stroke-width="1.4" marker-end="url(#arT)"/>
  <line x1="980" y1="175" x2="1006" y2="175" stroke="#5a6390" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ============ READ ============ -->
  <text class="lane" x="44" y="262" fill="#8b7cff">READ</text>
  <text class="when" x="44" y="280">every turn</text>

  <rect x="188" y="228" width="180" height="66" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
  <text class="bt" x="204" y="255">user message</text>
  <text class="bs" x="204" y="274">the query</text>

  <rect x="404" y="228" width="252" height="66" rx="10" fill="#8b7cff" fill-opacity="0.07" stroke="#8b7cff" stroke-opacity="0.32"/>
  <text class="bt" x="420" y="253">4-channel recall</text>
  <text class="bs" x="420" y="272">semantic · identity</text>
  <text class="bs" x="420" y="286">graph · temporal</text>

  <rect x="692" y="228" width="238" height="66" rx="10" fill="#8b7cff" fill-opacity="0.07" stroke="#8b7cff" stroke-opacity="0.32"/>
  <text class="bt" x="708" y="255">4±1 slot competition</text>
  <text class="bs" x="708" y="274">redundancy penalty · empty ok</text>

  <rect x="966" y="228" width="270" height="66" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
  <text class="bt" x="982" y="255">MRS render → context</text>
  <text class="bs" x="982" y="274">~116 tokens per turn, as table rows</text>

  <line x1="372" y1="261" x2="398" y2="261" stroke="#5a6390" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="660" y1="261" x2="686" y2="261" stroke="#8b7cff" stroke-width="1.4" marker-end="url(#arV)"/>
  <line x1="934" y1="261" x2="960" y2="261" stroke="#8b7cff" stroke-width="1.4" marker-end="url(#arV)"/>

  <!-- ============ SLEEP ============ -->
  <text class="lane" x="44" y="348" fill="#e0a45e">SLEEP</text>
  <text class="when" x="44" y="366">offline</text>

  <rect x="188" y="314" width="180" height="66" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.08"/>
  <text class="bt" x="204" y="341">lattice snapshot</text>
  <text class="bs" x="204" y="360">cells + hyperedges</text>

  <rect x="404" y="314" width="206" height="66" rx="10" fill="#e0a45e" fill-opacity="0.07" stroke="#e0a45e" stroke-opacity="0.3"/>
  <text class="bt" x="420" y="341">NREM · abstract</text>
  <text class="bs" x="420" y="360">merge into schemas</text>

  <rect x="646" y="314" width="246" height="66" rx="10" fill="#e0a45e" fill-opacity="0.07" stroke="#e0a45e" stroke-opacity="0.3"/>
  <text class="bt" x="662" y="341">REM · diverge</text>
  <text class="bs" x="662" y="360">grow ASSOC edges</text>

  <rect x="928" y="314" width="308" height="66" rx="10" fill="#e0a45e" fill-opacity="0.07" stroke="#e0a45e" stroke-opacity="0.3"/>
  <text class="bt" x="944" y="341">forget · demote</text>
  <text class="bs" x="944" y="360">(1 + F·t/S)^-0.5 · one tier per pass</text>

  <line x1="372" y1="347" x2="398" y2="347" stroke="#5a6390" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="614" y1="347" x2="640" y2="347" stroke="#e0a45e" stroke-width="1.4" marker-end="url(#arA)"/>
  <line x1="896" y1="347" x2="922" y2="347" stroke="#e0a45e" stroke-width="1.4" marker-end="url(#arA)"/>

  <line x1="44" y1="412" x2="1236" y2="412" stroke="#ffffff" stroke-opacity="0.06"/>
  <rect x="44" y="436" width="34" height="3" rx="1.5" fill="#3fe0d0"/>
  <text class="cap" x="44" y="468">The lattice is derived state: rebuild it by replaying session_log, and replay any recall byte-for-byte from its snapshot.</text>
  <text class="cap" x="44" y="490" fill="#4a5470">No step on the write path is a summary — the original bytes stay in the residual, so a lossy projection is always reversible.</text>
</svg>

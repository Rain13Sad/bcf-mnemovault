<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="MnemoVault — long-term memory and affect for DeepSeek Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.5" stop-color="#151a33"/>
      <stop offset="1" stop-color="#241a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#6d5efc" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#6d5efc" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#6d5efc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#2ad3b6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2ad3b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- lattice -->
  <g stroke-linecap="round">
    <line x1="860" y1="150" x2="980" y2="104" stroke="#7c6bff" stroke-opacity="0.3" stroke-width="1.6"/>
    <line x1="860" y1="150" x2="936" y2="248" stroke="#7c6bff" stroke-opacity="0.24" stroke-width="1.6"/>
    <line x1="980" y1="104" x2="1086" y2="184" stroke="#59e3c8" stroke-opacity="0.5" stroke-width="1.6"/>
    <line x1="980" y1="104" x2="1170" y2="118" stroke="#7c6bff" stroke-opacity="0.26" stroke-width="1.6"/>
    <line x1="1086" y1="184" x2="1170" y2="118" stroke="#59e3c8" stroke-opacity="0.4" stroke-width="1.6"/>
    <line x1="1086" y1="184" x2="1148" y2="286" stroke="#59e3c8" stroke-opacity="0.45" stroke-width="1.6"/>
    <line x1="936" y1="248" x2="1032" y2="312" stroke="#7c6bff" stroke-opacity="0.3" stroke-width="1.6"/>
    <line x1="1032" y1="312" x2="1148" y2="286" stroke="#59e3c8" stroke-opacity="0.36" stroke-width="1.6"/>
    <line x1="1170" y1="118" x2="1226" y2="206" stroke="#7c6bff" stroke-opacity="0.22" stroke-width="1.6"/>
    <line x1="860" y1="150" x2="812" y2="300" stroke="#7c6bff" stroke-opacity="0.18" stroke-width="1.6"/>
    <line x1="812" y1="300" x2="936" y2="248" stroke="#59e3c8" stroke-opacity="0.26" stroke-width="1.6"/>
  </g>
  <g fill="#59e3c8">
    <circle cx="980" cy="104" r="5" fill-opacity="0.9"/>
    <circle cx="1086" cy="184" r="7" fill-opacity="0.95"/>
    <circle cx="1032" cy="312" r="5" fill-opacity="0.85"/>
    <circle cx="1226" cy="206" r="3.5" fill-opacity="0.6"/>
  </g>
  <g fill="#8b7cff">
    <circle cx="860" cy="150" r="8" fill-opacity="0.95"/>
    <circle cx="936" cy="248" r="4.5" fill-opacity="0.8"/>
    <circle cx="1148" cy="286" r="4.5" fill-opacity="0.8"/>
    <circle cx="1170" cy="118" r="5.5" fill-opacity="0.85"/>
    <circle cx="812" cy="300" r="3" fill-opacity="0.55"/>
  </g>

  <!-- wordmark -->
  <text x="96" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="86" font-weight="700" fill="#f6f7ff" letter-spacing="-2">MnemoVault</text>
  <text x="99" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#a8b2d8">Long-term memory &amp; affect for DeepSeek Harness</text>
  <text x="99" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#6f7aa8">2048-bit sparse codes · 4-channel recall · ~116 tokens per turn</text>

  <!-- metric chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">
    <rect x="99" y="404" width="228" height="58" rx="10" fill="#111827" stroke="#2b3352"/>
    <text x="120" y="430" fill="#59e3c8" font-size="13" letter-spacing="1.4">RECALL@8</text>
    <text x="120" y="452" fill="#e8ecfb" font-size="19" font-weight="600">0.941</text>

    <rect x="343" y="404" width="228" height="58" rx="10" fill="#111827" stroke="#2b3352"/>
    <text x="364" y="430" fill="#8b7cff" font-size="13" letter-spacing="1.4">TESTS</text>
    <text x="364" y="452" fill="#e8ecfb" font-size="19" font-weight="600">93 passing</text>

    <rect x="587" y="404" width="228" height="58" rx="10" fill="#111827" stroke="#2b3352"/>
    <text x="608" y="430" fill="#e0a45e" font-size="13" letter-spacing="1.4">RUNTIME DEPS</text>
    <text x="608" y="452" fill="#e8ecfb" font-size="19" font-weight="600">0</text>

    <rect x="831" y="404" width="228" height="58" rx="10" fill="#111827" stroke="#2b3352"/>
    <text x="852" y="430" fill="#a8b2d8" font-size="13" letter-spacing="1.4">PACKAGES</text>
    <text x="852" y="452" fill="#e8ecfb" font-size="19" font-weight="600">10 · TypeScript</text>
  </g>

  <rect x="99" y="512" width="52" height="3" rx="1.5" fill="#59e3c8"/>
  <text x="99" y="556" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5d6790">github.com/Rain13Sad/bcf-mnemovault</text>
</svg>

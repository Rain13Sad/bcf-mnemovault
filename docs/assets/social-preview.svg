<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="MnemoVault — long-term memory and affect for DeepSeek Harness">
  <title>MnemoVault — long-term memory &amp; affect for DeepSeek Harness</title>
  <desc>2048-bit sparse codes, 4-channel recall, ~116 tokens per turn. Recall@8 0.941, 176 tests passing, recall p95 25 ms at 10k cells, 10 TypeScript packages.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#0b0820"/>
      <stop offset="0.45" stop-color="#0a1030"/>
      <stop offset="1" stop-color="#04141c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b4bff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5b4bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#25d3c2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#25d3c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fe0d0"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .title { font: 700 62px/1 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #ffffff; letter-spacing: -1.2px; }
      .sub   { font: 400 24px/1.2 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #b9b6d8; letter-spacing: .2px; }
      .mono  { font: 400 14px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #7d7ea6; letter-spacing: 1.5px; }
      .k     { font: 600 10.5px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 1.4px; }
      .v     { font: 700 16.5px/1 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #ffffff; }
      .url   { font: 400 12.5px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #6f7f9f; letter-spacing: .9px; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <ellipse cx="1000" cy="90" rx="380" ry="230" fill="url(#glowA)"/>
  <ellipse cx="300" cy="300" rx="420" ry="180" fill="url(#glowB)"/>

  <!-- 星座图：记忆晶格（节点 = cell，边 = 超边） -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#6d5bd0" stroke-opacity="0.5" stroke-width="1.2">
      <path d="M742 68.9 L852 36"/>
      <path d="M852 36 L944 90.8"/>
      <path d="M944 90.8 L1058 54.8"/>
      <path d="M944 90.8 L1016 150.3"/>
      <path d="M1058 54.8 L1152 90.8"/>
      <path d="M742 68.9 L812 133"/>
      <path d="M812 133 L908 173.7"/>
      <path d="M908 173.7 L1016 150.3"/>
      <path d="M1152 90.8 L1136 180"/>
      <path d="M742 68.9 L716 175.3"/>
    </g>
    <g stroke="#2fbfae" stroke-opacity="0.45" stroke-width="1.2">
      <path d="M812 133 L944 90.8"/>
      <path d="M1016 150.3 L1136 180"/>
      <path d="M716 175.3 L812 133"/>
      <path d="M908 173.7 L812 133"/>
    </g>
  </g>

  <g>
    <circle cx="742" cy="68.9" r="8" fill="#7b6bff" filter="url(#soft)" opacity="0.8"/>
    <circle cx="742" cy="68.9" r="5" fill="#9b8dff"/>
    <circle cx="852" cy="36" r="4" fill="#a99bff"/>
    <circle cx="944" cy="90.8" r="5.5" fill="#3fe0d0" filter="url(#soft)" opacity="0.75"/>
    <circle cx="944" cy="90.8" r="4.2" fill="#66efe0"/>
    <circle cx="1058" cy="54.8" r="4.5" fill="#b3a6ff"/>
    <circle cx="1016" cy="150.3" r="4" fill="#66efe0"/>
    <circle cx="812" cy="133" r="4.5" fill="#a99bff"/>
    <circle cx="908" cy="173.7" r="3.5" fill="#8f7dff"/>
    <circle cx="716" cy="175.3" r="3" fill="#7b6bff"/>
    <circle cx="1152" cy="90.8" r="3.5" fill="#4fd8c8"/>
    <circle cx="1136" cy="180" r="3" fill="#4fd8c8"/>
  </g>

  <!-- 左侧：标题与主张 -->
  <text class="title" x="72" y="104">MnemoVault</text>
  <text class="sub" x="74" y="148">Long-term memory &amp; affect for DeepSeek Harness</text>
  <text class="mono" x="74" y="184">2048-BIT SPARSE CODES · 4-CHANNEL RECALL · ~116 TOKENS PER TURN</text>

  <!-- 四个数据卡：数字全部来自 artifacts/bench.json、test/ 与 packages/*/package.json -->
  <g>
    <rect x="74" y="202" width="274" height="54" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.07"/>
    <text class="k" x="92" y="222" fill="#3fe0d0">RECALL@8</text>
    <text class="v" x="92" y="243">0.941</text>

    <rect x="364" y="202" width="274" height="54" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.07"/>
    <text class="k" x="382" y="222" fill="#7ee787">TESTS</text>
    <text class="v" x="382" y="243">176 passing</text>

    <rect x="654" y="202" width="274" height="54" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.07"/>
    <text class="k" x="672" y="222" fill="#f0c674">RECALL P95 · 10K</text>
    <text class="v" x="672" y="243">25 ms</text>

    <rect x="944" y="202" width="274" height="54" rx="6" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.07"/>
    <text class="k" x="962" y="222" fill="#9b8dff">PACKAGES</text>
    <text class="v" x="962" y="243">10 · TypeScript</text>
  </g>

  <rect x="74" y="282" width="44" height="3" rx="1.5" fill="url(#accent)"/>
  <text class="url" x="74" y="306">github.com/Rain13Sad/bcf-mnemovault</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1280" height="640" role="img" aria-label="MnemoVault — long-term memory and affect for DeepSeek Harness">
  <title>MnemoVault — long-term memory &amp; affect for DeepSeek Harness</title>
  <desc>2048-bit sparse codes, 4-channel recall, ~116 tokens per turn. Recall@8 0.941, 176 tests passing, zero third-party runtime dependencies, 10 TypeScript packages.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#0b0820"/>
      <stop offset="0.45" stop-color="#0a1030"/>
      <stop offset="1" stop-color="#04141c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b4bff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5b4bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#25d3c2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#25d3c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fe0d0"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .title { font: 700 72px/1 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #ffffff; letter-spacing: -1.4px; }
      .sub   { font: 400 24.8px/1.2 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #b9b6d8; letter-spacing: .2px; }
      .mono  { font: 400 13.9px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #7d7ea6; letter-spacing: 1.6px; }
      .k     { font: 600 11.2px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 1.5px; }
      .v     { font: 700 15.3px/1 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #ffffff; }
      .url   { font: 400 12.7px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #6f7f9f; letter-spacing: .9px; }
    </style>
  </defs>

  <rect width="1080" height="540" fill="url(#bg)"/>
  <ellipse cx="880" cy="180" rx="330" ry="250" fill="url(#glowA)"/>
  <ellipse cx="300" cy="470" rx="360" ry="180" fill="url(#glowB)"/>

  <!-- 星座图：记忆晶格（节点 = cell，边 = 超边） -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#6d5bd0" stroke-opacity="0.55" stroke-width="1.1">
      <path d="M700 278 L738 178"/>
      <path d="M738 178 L828 138"/>
      <path d="M828 138 L906 196"/>
      <path d="M906 196 L986 162"/>
      <path d="M906 196 L944 254"/>
      <path d="M738 178 L788 256"/>
      <path d="M788 256 L700 278"/>
      <path d="M788 256 L944 254"/>
    </g>
    <g stroke="#2fbfae" stroke-opacity="0.5" stroke-width="1.1">
      <path d="M944 254 L900 310"/>
      <path d="M900 310 L788 256"/>
      <path d="M900 310 L1030 278"/>
      <path d="M986 162 L1030 278"/>
      <path d="M828 138 L870 94"/>
    </g>
    <g stroke="#3f4fa8" stroke-opacity="0.35" stroke-width="1">
      <path d="M700 278 L676 206"/>
      <path d="M676 206 L738 178"/>
    </g>
  </g>

  <g>
    <circle cx="700" cy="278" r="9" fill="#7b6bff" filter="url(#soft)" opacity="0.85"/>
    <circle cx="700" cy="278" r="5.5" fill="#9b8dff"/>
    <circle cx="738" cy="178" r="5" fill="#8f7dff"/>
    <circle cx="828" cy="138" r="4" fill="#a99bff"/>
    <circle cx="906" cy="196" r="5.5" fill="#8f7dff"/>
    <circle cx="986" cy="162" r="4.5" fill="#b3a6ff"/>
    <circle cx="944" cy="254" r="8" fill="#3fe0d0" filter="url(#soft)" opacity="0.8"/>
    <circle cx="944" cy="254" r="5" fill="#66efe0"/>
    <circle cx="788" cy="256" r="4.5" fill="#a99bff"/>
    <circle cx="900" cy="310" r="4" fill="#66efe0"/>
    <circle cx="1030" cy="278" r="3.5" fill="#4fd8c8"/>
    <circle cx="870" cy="94" r="3" fill="#8f7dff"/>
    <circle cx="676" cy="206" r="3" fill="#7b6bff"/>
  </g>

  <!-- 左侧：标题与主张 -->
  <text class="title" x="81.5" y="201">MnemoVault</text>
  <text class="sub" x="84" y="251.5">Long-term memory &amp; affect for DeepSeek Harness</text>
  <text class="mono" x="84" y="293.5">2048-bit sparse codes · 4-channel recall · ~116 tokens per turn</text>

  <!-- 四个数据卡：数字全部来自 artifacts/bench.json、test/ 与 packages/*/package.json -->
  <g>
    <rect x="84" y="345" width="196" height="46" rx="5" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.07"/>
    <text class="k" x="102" y="363" fill="#3fe0d0">RECALL@8</text>
    <text class="v" x="102" y="381">0.941</text>

    <rect x="292" y="345" width="196" height="46" rx="5" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.07"/>
    <text class="k" x="310" y="363" fill="#7ee787">TESTS</text>
    <text class="v" x="310" y="381">176 passing</text>

    <rect x="500" y="345" width="196" height="46" rx="5" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.07"/>
    <text class="k" x="518" y="363" fill="#f0c674">3P RUNTIME DEPS</text>
    <text class="v" x="518" y="381">0</text>

    <rect x="708" y="345" width="196" height="46" rx="5" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.07"/>
    <text class="k" x="726" y="363" fill="#9b8dff">PACKAGES</text>
    <text class="v" x="726" y="381">10 · TypeScript</text>
  </g>

  <rect x="84" y="432" width="46" height="3" rx="1.5" fill="url(#accent)"/>
  <text class="url" x="84" y="469.5">github.com/Rain13Sad/bcf-mnemovault</text>
</svg>
